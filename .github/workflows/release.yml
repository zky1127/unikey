name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm run tauri build -- --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
      - uses: actions/upload-artifact@v4
        with:
          name: UniKey-Windows
          path: src-tauri/target/release/bundle/nsis/UniKey_*_x64-setup.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: npm install
      - run: npm run tauri build -- --bundles dmg --target universal-apple-darwin
        env:
          APPLE_CERTIFICATE: ""
          APPLE_CERTIFICATE_PASSWORD: ""
          APPLE_SIGNING_IDENTITY: ""
          APPLE_TEAM_ID: ""
      - uses: actions/upload-artifact@v4
        with:
          name: UniKey-macOS
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/UniKey_*.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libasound2-dev
      - run: npm install
      - run: npm run tauri build -- --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: UniKey-Linux
          path: |
            src-tauri/target/release/bundle/deb/UniKey_*.deb
            src-tauri/target/release/bundle/appimage/UniKey_*.AppImage

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "UniKey-*", path: artifacts }
      - run: ls -R artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
