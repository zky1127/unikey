name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  CI: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Build Windows
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: UniKey-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
        if: always()

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Build macOS binary
        working-directory: src-tauri
        run: cargo build --release
      - name: Create app bundle
        run: |
          mkdir -p UniKey.app/Contents/MacOS
          mkdir -p UniKey.app/Contents/Resources
          cp src-tauri/target/release/unikey UniKey.app/Contents/MacOS/
          cp -r dist UniKey.app/Contents/Resources/
          echo '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>CFBundleExecutable</key><string>unikey</string><key>CFBundleIdentifier</key><string>com.zky1127.unikey</string><key>CFBundleName</key><string>UniKey</string><key>CFBundleVersion</key><string>0.1.0</string></dict></plist>' > UniKey.app/Contents/Info.plist
      - uses: actions/upload-artifact@v4
        with:
          name: UniKey-macOS-arm64
          path: UniKey.app

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libasound2-dev
      - run: npm install
      - name: Build Linux
        run: npx tauri build --bundles deb
      - uses: actions/upload-artifact@v4
        with:
          name: UniKey-Linux-x64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
        if: always()

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "UniKey-*", path: artifacts, merge-multiple: true }
      - run: ls -R artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "UniKey ${{ github.ref_name }}"
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
